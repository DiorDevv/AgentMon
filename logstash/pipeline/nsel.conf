# Cisco FTD NSEL (NetFlow v9) -> ixcham JSON -> Redis
#
# Logstash bu yerda faqat stateless ish qiladi: dekodlash va keraksiz maydonlarni
# tashlash. Barcha logika (subnet, target guruhlari, holatlar) engine'da —
# u yerda test qilinadi va AD'dan avtomatik yangilanadi.
#
# Chiqish formati:  {"src":"10.1.2.3","dst":"172.25.44.50","dport":8888,"ev":1,"ts":1726900000,"exp":"172.25.0.1"}
#   ev  - NSEL NF_F_FW_EVENT: 1=created 2=teardown 3=denied 5=update (0 = oddiy NetFlow)
#   ts  - Logstash qabul qilgan vaqt (unix). FTD soatiga bog'liq bo'lmaslik uchun.
#   exp - paketni yuborgan eksporter (FTD) IP'si — engine har bir FTD'ni alohida kuzatadi.
#
# Xavfsizlik: NSEL_EXPORTERS (vergul bilan FTD IP'lari) berilsa, faqat ulardan kelgan paketlar qabul qilinadi.
# Aks holda tarmoqdagi istalgan qurilma soxta NetFlow yuborib, agenti yo'q kompyuterni "ishlayapti" qilib
# ko'rsatishi mumkin.

input {
  udp {
    port => 2055
    workers => "${NSEL_WORKERS:4}"
    queue_size => 50000
    receive_buffer_bytes => 33554432
    codec => netflow {
      versions => [9]
      cache_save_path => "/usr/share/logstash/data"
    }
  }
}

filter {
  ruby {
    init => '
      require "ipaddr"
      @private_nets = [IPAddr.new("10.0.0.0/8"), IPAddr.new("172.16.0.0/12"), IPAddr.new("192.168.0.0/16")]
      @exporters = (ENV["NSEL_EXPORTERS"] || "").split(",").map(&:strip).reject(&:empty?)
      if @exporters.empty?
        logger.warn("NSEL_EXPORTERS berilmagan: har qanday manzildan kelgan NetFlow qabul qilinadi (faqat sinov uchun)")
      end
    '
    code => '
      exp = event.get("host")
      exp = exp["ip"] if exp.is_a?(Hash)   # ECS rejimida [host][ip]
      nf = event.get("netflow")
      src = nf && nf["ipv4_src_addr"]
      dst = nf && nf["ipv4_dst_addr"]
      private_src = begin
        !src.nil? && @private_nets.any? { |n| n.include?(src) }
      rescue IPAddr::InvalidAddressError
        false
      end
      if !@exporters.empty? && !@exporters.include?(exp.to_s)
        event.cancel                         # ruxsat etilmagan eksporter
      elsif !private_src || dst.nil?
        # Faqat ichki manbadan chiqqan sessiyalar kerak (internetdan kiruvchi trafik engine uchun keraksiz yuk).
        event.cancel
      else
        fw = nf["fw_event"] || nf["firewall_event"] || 0
        event.set("src", src)
        event.set("dst", dst)
        event.set("dport", (nf["l4_dst_port"] || 0).to_i)
        event.set("ev", fw.to_i)
        event.set("ts", Time.now.to_i)
        event.set("exp", exp.to_s)
      end
    '
  }
  prune {
    whitelist_names => ["^src$", "^dst$", "^dport$", "^ev$", "^ts$", "^exp$"]
  }
}

output {
  redis {
    host => "redis"
    data_type => "list"
    key => "${REDIS_KEY:nsel}"
    batch => true
    batch_events => 1000
    codec => json
  }
}
