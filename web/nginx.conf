# Shablon: nginx image ishga tushishda ${WEB_HTTPS_PORT} ni muhit o'zgaruvchisidan qo'yadi (envsubst).
# nginx'ning o'z o'zgaruvchilari ($host, $uri ...) o'zgarmaydi — ular muhitda yo'q.

# HTTP faqat HTTPS'ga yo'naltiradi: parollar hech qachon shifrlanmagan kanalda yuborilmaydi.
server {
    listen 80;
    server_name _;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://$host:${WEB_HTTPS_PORT}$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;

    # Sertifikat: ./certs/tls.crt va ./certs/tls.key (korporativ CA'dan). Bo'lmasa — o'z-o'zidan imzolangan
    # sertifikat birinchi ishga tushishda yaratiladi (docker-entrypoint.d/15-agentmon-tls.sh).
    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # Docker ichki DNS: api konteyneri qayta yaratilib IP o'zgarsa ham nginx yangi manzilni topadi
    # (proxy_pass'da o'zgaruvchi ishlatilganda nom har so'rovda resolver orqali aniqlanadi).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        # Mijoz IP'si: nginx uni o'zi o'rnatadi (mijoz yuborgan X-Forwarded-For e'tiborga olinmaydi) —
        # api login urinishlarini shu IP bo'yicha cheklaydi.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # add_header bu yerda ishlatilmaydi — aks holda server darajasidagi xavfsizlik header'lari yo'qoladi.
    location /assets/ {
        expires 30d;
    }

    location / {
        try_files $uri /index.html;
    }
}
