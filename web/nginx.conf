server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    # Docker ichki DNS: api konteyneri qayta yaratilib IP o'zgarsa ham nginx yangi manzilni topadi
    # (proxy_pass'da o'zgaruvchi ishlatilganda nom har so'rovda resolver orqali aniqlanadi).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # add_header bu yerda ishlatilmaydi — aks holda server darajasidagi xavfsizlik header'lari yo'qoladi.
    location /assets/ {
        expires 30d;
    }

    location / {
        try_files $uri /index.html;
    }
}
