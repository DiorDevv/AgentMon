name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # DSN berilgani uchun DB testlari o'tkazib yuborilmaydi — hammasi majburiy ishlaydi.
      - run: python -m pytest -q
        env:
          AGENTMON_TEST_DSN: postgresql://postgres:test@localhost:5432/test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  logstash-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Logstash pipeline sintaksisi
        run: |
          docker run --rm -v "$PWD/logstash/pipeline:/p:ro" -e NSEL_WORKERS=1 \
            docker.elastic.co/logstash/logstash:8.15.3 \
            logstash --config.test_and_exit -f /p/nsel.conf
